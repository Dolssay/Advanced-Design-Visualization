# Production-like local stack: both images, frontend on http://localhost:8080
#   docker compose -f deploy/docker-compose.yml up --build
# For day-to-day frontend work you don't need this: run the backend with uvicorn
# and the frontend with `npm run dev` (see README).
services:
  backend:
    build:
      context: ../backend
    image: adv-viz-backend:local
    environment:
      SIZING_WORKERS: "2"
      PREBUILT_DIR: /srv/prebuilt
    # Precomputed ensembles, so the demo opens with data. Generate them first:
    #   cd backend && python -m pipelines.precompute_ensemble
    volumes:
      - ../backend/output/prebuilt:/srv/prebuilt:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3

  frontend:
    build:
      context: ../frontend
    image: adv-viz-frontend:local
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
